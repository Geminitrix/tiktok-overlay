<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay TikTok Live — Congregação das Bruxas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  ===== Congregação das Bruxas — Overlay vertical 1080x1920 (versão estática) =====

  Totalmente estático: sem animações, sem canvas e sem nada rodando em loop,
  para pesar o mínimo possível no TikTok LIVE Studio.

  Dica: a forma mais leve e nítida é usar a imagem pronta overlay.png
  (mesma pasta) como fonte "Imagem" no TikTok LIVE Studio.

  Recortes transparentes (posicione suas fontes no TikTok LIVE Studio exatamente aqui):
    Webcam   → x 60,  y 190, 960 × 540
    Gameplay → x 40,  y 892, 1000 × 563

  Parâmetros opcionais na URL (ex.: .../overlay/?nome=SEUNICK&sub=MAIN%20MORGANA):
    ?nome=Texto      nome principal (até 26 caracteres)
    ?sub=Texto       subtítulo (até 48 caracteres)
    ?rodape=A|B|C    as 3 frases do rodapé, uma por linha, separadas por |
                     (ex.: ?rodape=BEM-VINDOS|SIGA O CANAL|DEIXE SEU LIKE)
    ?fundo=0         remove o fundo escuro (mantém molduras)
    ?arte=0          esconde a arte da Morgana no rodapé
    ?opacidade=45    opacidade da arte (0 a 100)
    ?particulas=0    tira as brasas e penas decorativas
    ?runas=0         tira o círculo rúnico
    ?demo=1          mostra áreas de exemplo nos recortes (só para conferir no navegador)
    ?info=1          mostra o tamanho real em que o TikTok está desenhando o overlay
                     (o ideal é 1080×1920; menos que isso fica borrado ao esticar)
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: 1920px;
    transform-origin: 0 0;
    overflow: hidden;
    user-select: none;
    pointer-events: none;
    font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 1080px;
    height: 1920px;
  }
  /* Tudo que é "fundo" fica fora dos recortes da webcam e do gameplay */
  .cut {
    clip-path: path(evenodd, "M0 0H1080V1920H0Z M60 190H1020V730H60Z M40 892H1040V1455H40Z");
  }

  /* ---------- Fundo ---------- */
  #bg {
    background:
      radial-gradient(560px 460px at 220px 1590px, rgba(156, 15, 46, 0.42), rgba(156, 15, 46, 0)),
      radial-gradient(520px 430px at 980px 900px, rgba(38, 92, 108, 0.28), rgba(38, 92, 108, 0)),
      radial-gradient(520px 320px at 540px 20px, rgba(70, 44, 92, 0.42), rgba(70, 44, 92, 0)),
      radial-gradient(420px 340px at 960px 1760px, rgba(255, 45, 85, 0.18), rgba(255, 45, 85, 0)),
      radial-gradient(120% 70% at 50% 42%, #14101b 0%, #0b0910 48%, #050407 100%);
  }
  #art {
    position: absolute;
    left: 0;
    top: 1420px;
    width: 1080px;
    height: 500px;
    overflow: hidden;
    opacity: 0.45;
  }
  #art img {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: auto;
    filter: saturate(0.9) contrast(1.06) brightness(0.92);
    -webkit-mask-image: radial-gradient(62% 78% at 50% 34%, #000 38%, rgba(0,0,0,0.5) 62%, transparent 86%);
            mask-image: radial-gradient(62% 78% at 50% 34%, #000 38%, rgba(0,0,0,0.5) 62%, transparent 86%);
  }
  #art::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(7,6,10,0.85) 0%, rgba(7,6,10,0) 22%, rgba(7,6,10,0) 58%, rgba(5,4,7,0.95) 100%);
  }
  #runes { opacity: 0.16; }

  /* ---------- Placa do nome ---------- */
  #plate {
    position: absolute;
    left: 0;
    top: 742px;
    width: 1080px;
    height: 138px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .row {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 0 64px;
    gap: 30px;
  }
  .line {
    position: relative;
    flex: 1;
    height: 1px;
    min-width: 40px;
  }
  .line.l { background: linear-gradient(to right, rgba(230,225,239,0), rgba(230,225,239,0.55) 70%, rgba(255,122,150,0.9)); }
  .line.r { background: linear-gradient(to left, rgba(230,225,239,0), rgba(230,225,239,0.55) 70%, rgba(255,122,150,0.9)); }
  .line i {
    position: absolute;
    top: -5px;
    width: 11px;
    height: 11px;
    transform: rotate(45deg);
    background: radial-gradient(circle at 35% 35%, #ffc2cf 0%, #ff2d55 40%, #4d0311 100%);
    border: 1px solid rgba(230,225,239,0.8);
    box-shadow: 0 0 12px rgba(255,45,85,0.8);
  }
  .line.l i { right: -6px; }
  .line.r i { left: -6px; }

  #nick {
    margin: 0;
    padding-left: 0.26em; /* compensa o espaçamento da última letra */
    font-weight: 600;
    font-size: 66px;
    line-height: 1;
    letter-spacing: 0.26em;
    white-space: nowrap;
    background: linear-gradient(100deg, #a69fb6 0%, #ece8f4 30%, #ffffff 46%, #ffd6df 52%, #ffffff 58%, #ece8f4 72%, #a69fb6 100%);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 16px rgba(255,45,85,0.35)) drop-shadow(0 2px 2px rgba(0,0,0,0.8));
  }
  #sub {
    margin-top: 14px;
    padding-left: 0.44em;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.44em;
    color: #ff7a96;
    text-shadow: 0 0 12px rgba(255,45,85,0.55);
    white-space: nowrap;
    opacity: 0.92;
  }

  /* ---------- Rodapé ---------- */
  #footer {
    position: absolute;
    left: 0;
    top: 1768px;
    width: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .frase {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
    width: 100%;
  }
  .frase .bar { width: 96px; height: 1px; }
  .frase .bar.l { background: linear-gradient(to right, rgba(230,225,239,0), rgba(255,122,150,0.7)); }
  .frase .bar.r { background: linear-gradient(to left, rgba(230,225,239,0), rgba(255,122,150,0.7)); }
  #frase1 {
    padding-left: 0.4em;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.4em;
    color: rgba(240, 235, 247, 0.92);
    text-shadow: 0 0 14px rgba(0,0,0,0.9), 0 0 22px rgba(255,45,85,0.3);
    white-space: nowrap;
  }
  #frase2 {
    padding-left: 0.36em;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.36em;
    color: rgba(230, 225, 239, 0.82);
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
    white-space: nowrap;
  }
  #frase3 {
    padding-left: 0.36em;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.36em;
    color: #ff7a96;
    text-shadow: 0 0 12px rgba(255,45,85,0.6), 0 0 10px rgba(0,0,0,0.9);
    white-space: nowrap;
  }
  .heart {
    display: inline-block;
    width: 13px;
    height: 13px;
    margin-left: -6px;
    vertical-align: -1px;
  }

  /* ---------- Modo demonstração (?demo=1) ---------- */
  .demo-slot {
    position: absolute;
    display: none;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.28);
    font: 600 26px/1 system-ui, sans-serif;
    letter-spacing: 0.2em;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 22px, rgba(255,255,255,0.06) 22px 44px),
      linear-gradient(160deg, #26303a, #14161c);
  }
  body.demo { background: #2b2b30; }
  body.demo .demo-slot { display: flex; }

  /* ---------- Diagnóstico (?info=1) ---------- */
  #info {
    position: fixed;
    left: 8px;
    top: 8px;
    z-index: 10;
    padding: 6px 10px;
    border-radius: 6px;
    font: 600 14px/1.4 system-ui, sans-serif;
    color: #fff;
    background: rgba(0,0,0,0.8);
    white-space: pre;
  }
  #info.ok { box-shadow: inset 4px 0 0 #3ddc84; }
  #info.low { box-shadow: inset 4px 0 0 #ff2d55; }
</style>
</head>
<body>
<div id="stage">

  <!-- Áreas de exemplo (aparecem apenas com ?demo=1) -->
  <div class="demo-slot" style="left:60px;top:190px;width:960px;height:540px">WEBCAM 960×540</div>

  <div id="bg" class="layer cut">

    <svg id="runes" class="layer" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true">

      <use href="#feather" x="22" y="1180" width="22" height="42" transform="rotate(14 33 1201)" opacity="0.5"/>

  <!-- Molduras e emblema -->
  <svg id="frames" class="layer" viewBox="0 0 1080 1920" width="1080" height="1920" aria-hidden="true">

      <linearGradient id="g-silver" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.45" stop-color="#c9c2d6"/>
        <stop offset="1" stop-color="#6f6880"/>
      </linearGradient>
      <linearGradient id="g-edge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e6e1ef" stop-opacity="0.75"/>
        <stop offset="0.5" stop-color="#ff2d55" stop-opacity="0.85"/>
        <stop offset="1" stop-color="#e6e1ef" stop-opacity="0.75"/>
      </linearGradient>
      <radialGradient id="g-gem" cx="0.36" cy="0.32" r="0.75">
        <stop offset="0" stop-color="#ffc2cf"/>
        <stop offset="0.4" stop-color="#ff2d55"/>
        <stop offset="1" stop-color="#4d0311"/>
      </radialGradient>
      <linearGradient id="g-line-l" x1="150" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#e6e1ef" stop-opacity="0"/>
        <stop offset="1" stop-color="#e6e1ef" stop-opacity="0.55"/>
      </linearGradient>
      <linearGradient id="g-line-r" x1="930" y1="0" x2="610" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#e6e1ef" stop-opacity="0"/>
        <stop offset="1" stop-color="#e6e1ef" stop-opacity="0.55"/>
      </linearGradient>
      <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="f-soft" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>
      <mask id="m-crescent">
        <rect x="490" y="40" width="100" height="110" fill="#000"/>

        <circle cx="540" cy="86" r="28" fill="#000"/>
      </mask>
    </defs>

    <g id="frame-webcam"></g>
    <g id="frame-gameplay"></g>

    <!-- Emblema da Congregação: lua crescente com gema -->
    <g id="emblem">
      <path d="M150,96 H470" stroke="url(#g-line-l)" stroke-width="1"/>
      <path d="M610,96 H930" stroke="url(#g-line-r)" stroke-width="1"/>
      <path d="M470,90 L476,96 L470,102 L464,96 Z" fill="url(#g-gem)"/>
      <path d="M610,90 L616,96 L610,102 L604,96 Z" fill="url(#g-gem)"/>
      <circle cx="540" cy="96" r="50" fill="none" stroke="#ff2d55" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 7"/>
      <path d="M540,40 A56,56 0 0 1 596,96" fill="none" stroke="#e6e1ef" stroke-opacity="0.5" stroke-width="1.2"/>
      <path d="M540,152 A56,56 0 0 1 484,96" fill="none" stroke="#e6e1ef" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="540" cy="96" r="34" fill="#ff2d55" opacity="0.22" filter="url(#f-soft)"/>
      <rect x="490" y="40" width="100" height="110" fill="url(#g-silver)" mask="url(#m-crescent)"/>
      <path d="M540,72 L549,88 L540,104 L531,88 Z" fill="url(#g-gem)" stroke="#f3eef9" stroke-width="1.2" filter="url(#f-glow)"/>

  </svg>

  <!-- Placa do nome -->
  <div id="plate">
    <div class="row">
      <span class="line l"><i></i></span>
      <h1 id="nick">LUMOX</h1>
      <span class="line r"><i></i></span>
    </div>
    <div id="sub">MAIN MORGANA · SUPORTE</div>
  </div>

  <!-- Rodapé com as duas frases -->
  <div id="footer">
    <div class="frase">
      <span class="bar l"></span>
      <span id="frase1">BEM-VINDOS À CONGREGAÇÃO</span>
      <span class="bar r"></span>
    </div>
    <div class="frase">
      <span id="frase2">SIGA E ENTRE PARA O COVEN</span>
    </div>
    <div class="frase">
      <span id="frase3">TOQUE NA TELA · DEIXE SEU LIKE</span><svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="#ff2d55"/></svg>
    </div>
  </div>
</div>

<!-- Configuração padrão (o estúdio preenche este bloco ao exportar; a URL sempre tem prioridade) -->
<script id="coven-config" type="application/json">{}</script>
<script>
(function () {
  'use strict';

  // Tudo aqui roda uma única vez ao abrir a página: não há animações nem loops.
  var W = 1080, H = 1920;
  var CUTS = [
    { x: 60, y: 190, w: 960,  h: 540 },
    { x: 40, y: 892, w: 1000, h: 563 }
  ];
  var SVGNS = 'http://www.w3.org/2000/svg';
  var q = new URLSearchParams(location.search);
  var defaults = {};
  try { defaults = JSON.parse(document.getElementById('coven-config').textContent) || {}; } catch (err) { defaults = {}; }
  Object.keys(defaults).forEach(function (k) {
    if (!q.has(k) && defaults[k] !== null && defaults[k] !== undefined) q.set(k, String(defaults[k]));
  });
  var stage = document.getElementById('stage');

  function flag(key, fallback) {
    var v = q.get(key);
    if (v === '0' || v === 'false') return false;
    if (v === '1' || v === 'true') return true;
    return fallback;
  }
  function text(key, max) {
    var v = (q.get(key) || '').trim();
    return v ? v.slice(0, max).toUpperCase() : null;
  }

  /* ---------- Escala 1080x1920 para qualquer tamanho de fonte ---------- */
  var info = null;
  if (flag('info', false)) {
    info = document.createElement('div');
    info.id = 'info';
    document.body.appendChild(info);
  }
  function fit() {
    var scale = Math.min(innerWidth / W, innerHeight / H);
    var offX = (innerWidth - W * scale) / 2;
    var offY = (innerHeight - H * scale) / 2;
    stage.style.transform = 'translate(' + offX + 'px,' + offY + 'px) scale(' + scale + ')';
    if (info) {
      var dpr = window.devicePixelRatio || 1;
      var drawnW = Math.round(W * scale * dpr), drawnH = Math.round(H * scale * dpr);
      var good = drawnW >= W - 2;
      info.className = good ? 'ok' : 'low';
      info.textContent =
        'Área do link: ' + innerWidth + '×' + innerHeight + ' (zoom ' + dpr + ')\n' +
        'Overlay desenhado em: ' + drawnW + '×' + drawnH + ' px\n' +
        (good ? 'Qualidade máxima' : 'Abaixo de 1080×1920: vai borrar ao esticar');
    }
  }
  addEventListener('resize', fit);
  fit();

  /* ---------- Configuração via URL ---------- */
  var nick = document.getElementById('nick');
  var sub = document.getElementById('sub');
  var frase1 = document.getElementById('frase1');
  var frase2 = document.getElementById('frase2');
  var frase3 = document.getElementById('frase3');
  var t;
  if ((t = text('nome', 26))) nick.textContent = t;
  if ((t = text('sub', 48))) sub.textContent = t;
  var frases = (q.get('rodape') || '').split('|')
    .map(function (m) { return m.trim().slice(0, 52).toUpperCase(); })
    .filter(Boolean);
  if (frases[0]) frase1.textContent = frases[0];
  if (frases[1]) frase2.textContent = frases[1];
  if (frases[2]) frase3.textContent = frases[2];

  if (!flag('fundo', true)) document.getElementById('bg').style.display = 'none';
  var art = document.getElementById('art');
  if (!flag('arte', true)) art.style.display = 'none';
  var op = Number(q.get('opacidade'));
  if (q.get('opacidade') !== null && q.get('opacidade') !== '' && isFinite(op)) {
    art.style.opacity = Math.max(0, Math.min(100, op)) / 100;
  }
  if (!flag('runas', true)) document.getElementById('runes').style.display = 'none';
  if (!flag('particulas', true)) document.getElementById('sparks').style.display = 'none';
  if (flag('demo', false)) document.body.classList.add('demo');

  // Ajusta o tamanho dos textos para nunca encostarem nas bordas
  function fitText(el, maxWidth, maxSize, minSize) {
    var size = maxSize;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > maxWidth && size > minSize) {
      size -= 1;
      el.style.fontSize = size + 'px';
    }
  }
  function fitAll() {
    fitText(nick, 700, 66, 30);
    fitText(sub, 880, 17, 11);
    fitText(frase1, 740, 21, 12);
    fitText(frase2, 820, 16, 11);
    fitText(frase3, 800, 16, 11);
  }
  fitAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  /* ---------- Molduras ---------- */
  function el(tag, attrs, parent) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function diamond(cx, cy, r) {
    return 'M' + cx + ',' + (cy - r) + ' L' + (cx + r) + ',' + cy + ' L' + cx + ',' + (cy + r) + ' L' + (cx - r) + ',' + cy + ' Z';
  }
  // Trechos de "energia" carmesim fixos, como acentos (fração do perímetro, comprimento)
  var ACCENTS = [[0.06, 0.07], [0.56, 0.07]];
  function buildFrame(c, g, accentShift) {
    var x = c.x, y = c.y, X = c.x + c.w, Y = c.y + c.h;
    var o = 12, L = 58;

    el('rect', { x: x - 3, y: y - 3, width: c.w + 6, height: c.h + 6, fill: 'none',
      stroke: '#ff2d55', 'stroke-width': 8, filter: 'url(#f-soft)', opacity: 0.22 }, g);
    el('rect', { x: x - o, y: y - o, width: c.w + 2 * o, height: c.h + 2 * o, fill: 'none',
      stroke: '#e6e1ef', 'stroke-opacity': 0.14, 'stroke-width': 1 }, g);
    el('rect', { x: x - 1, y: y - 1, width: c.w + 2, height: c.h + 2, fill: 'none',
      stroke: 'url(#g-edge)', 'stroke-width': 2 }, g);
    ACCENTS.forEach(function (a) {
      var start = ((a[0] + accentShift) % 1) * 1000, len = a[1] * 1000;
      var dash = len + ' ' + (1000 - len);
      el('rect', { x: x - 1, y: y - 1, width: c.w + 2, height: c.h + 2, pathLength: 1000, fill: 'none',
        stroke: '#ff2d55', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-dasharray': dash,
        'stroke-dashoffset': -start, filter: 'url(#f-glow)', opacity: 0.85 }, g);
      el('rect', { x: x - 1, y: y - 1, width: c.w + 2, height: c.h + 2, pathLength: 1000, fill: 'none',
        stroke: '#ffe3ea', 'stroke-width': 1.6, 'stroke-linecap': 'round', 'stroke-dasharray': dash,
        'stroke-dashoffset': -start }, g);
    });
    var a = x - o, b = y - o, A = X + o, B = Y + o;
    [
      'M' + a + ',' + (b + L) + ' V' + b + ' H' + (a + L),
      'M' + (A - L) + ',' + b + ' H' + A + ' V' + (b + L),
      'M' + A + ',' + (B - L) + ' V' + B + ' H' + (A - L),
      'M' + (a + L) + ',' + B + ' H' + a + ' V' + (B - L)
    ].forEach(function (d) {
      el('path', { d: d, fill: 'none', stroke: 'url(#g-silver)', 'stroke-width': 3, 'stroke-linecap': 'square' }, g);
    });
    [[a, b], [A, b], [A, B], [a, B]].forEach(function (p) {
      el('path', { d: diamond(p[0], p[1], 7), fill: 'url(#g-gem)', stroke: '#f3eef9', 'stroke-width': 1.1 }, g);
    });
    el('path', { d: diamond(a, (b + B) / 2, 4), fill: '#e6e1ef', opacity: 0.6 }, g);
    el('path', { d: diamond(A, (b + B) / 2, 4), fill: '#e6e1ef', opacity: 0.6 }, g);
  }
  buildFrame(CUTS[0], document.getElementById('frame-webcam'), 0);
  buildFrame(CUTS[1], document.getElementById('frame-gameplay'), 0.25);

  /* ---------- Runas antigas ---------- */
  var RUNES = [
    'M0,-12 L0,12 M0,-8 L7,-2 M0,1 L-6,7 M-5,-9 L5,-9',
    'M0,-12 L0,12 M-6,-6 L6,6 M-6,6 L0,0',
    'M-5,-11 L5,-11 M0,-11 L0,11 M0,-3 L7,4 M0,4 L-6,10',
    'M0,-12 L6,-3 L0,5 L-6,-3 Z M0,5 L0,12',
    'M-6,-10 L0,0 L6,-10 M0,0 L0,12 M-5,6 L5,6',
    'M0,-12 L0,12 M-7,-4 L7,-4 M-4,4 L6,10',
    'M-4,-11 L4,0 L-4,11 M2,-6 L7,-1',
    'M0,-12 L0,12 M0,-7 L-7,-1 M0,2 L7,8'
  ];
  var glyphs = document.getElementById('rune-glyphs');
  for (var i = 0; i < 18; i++) {
    var deg = 360 / 18 * i, rad = deg * Math.PI / 180;
    el('path', {
      d: RUNES[i % RUNES.length],
      transform: 'translate(' + (540 + Math.cos(rad) * 231).toFixed(1) + ',' + (1690 + Math.sin(rad) * 231).toFixed(1) + ') rotate(' + (deg + 90) + ') scale(0.8)',
      fill: 'none', stroke: 'currentColor', 'stroke-width': 1.8, 'stroke-linecap': 'round'
    }, glyphs);
  }

  /* ---------- Brasas fixas (posições sempre iguais) ---------- */
  var seed = 26082026;
  function rand() {
    seed = (seed + 0x6d2b79f5) | 0;
    var r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  }
  function insideCut(px, py, pad) {
    return CUTS.some(function (c) {
      return px > c.x - pad && px < c.x + c.w + pad && py > c.y - pad && py < c.y + c.h + pad;
    });
  }
  var dots = document.getElementById('ember-dots');
  var placed = 0, tries = 0;
  while (placed < 46 && tries < 2000) {
    tries++;
    var ex = rand() * W, ey = rand() * H, size = 4 + rand() * 12;
    if (insideCut(ex, ey, 22)) continue;
    // menos brasas sobre os textos da placa
    if (ey > 760 && ey < 870 && ex > 250 && ex < 830) continue;
    el('circle', {
      cx: ex.toFixed(1), cy: ey.toFixed(1), r: (size / 2).toFixed(1),
      fill: rand() < 0.75 ? 'url(#g-ember)' : 'url(#g-ember-silver)',
      opacity: (0.35 + rand() * 0.6).toFixed(2)
    }, dots);
    placed++;
  }
})();
</script>
