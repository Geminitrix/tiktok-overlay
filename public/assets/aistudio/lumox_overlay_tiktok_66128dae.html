<style>
  /* ===== Ajustes rápidos =====
     Na URL do arquivo você pode usar:
       ?fundo=0        → remove o fundo escuro (só molduras e partículas)
       ?nome=SeuNick   → troca o nome na placa
       ?sub=Texto      → troca o subtítulo
       ?particulas=0   → desliga brasas e penas
  */
  html, body { background: transparent !important; }
  .pulse  { animation: pulse 2.8s ease-in-out infinite; }
  .gem    { animation: gem 3.2s ease-in-out infinite; }
  .spin   { animation: spin 120s linear infinite; transform-box: view-box; }
  .spin-r { animation-direction: reverse; animation-duration: 90s; }
  .wing-l { animation: sway-l 7s ease-in-out infinite; transform-box: view-box; }
  .wing-r { animation: sway-r 7s ease-in-out infinite; transform-box: view-box; }
  .swirl  { stroke-dasharray: 220 70; animation: swirl 4s linear infinite; }
  .swirl2 { animation-duration: 6s; animation-direction: reverse; }
  .mist   { animation: drift 18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .mist:nth-child(2n) { animation-duration: 24s; animation-delay: -6s; }
  .particles { clip-path: path(evenodd, "M0 0H1080V1920H0Z M60 190h960v540h-960Z M40 892h1000v563h-1000Z"); }
  .ember { position:absolute; border-radius:9999px; opacity:0;
            background: radial-gradient(circle, #ffd2c2 0%, #ff2d55 45%, rgba(255,45,85,0) 72%);
            animation: rise linear infinite; }
  .fall { position:absolute; opacity:0; animation: fall linear forwards; }
  .fall > div { width:100%; height:100%; animation: flutter 2.6s ease-in-out infinite alternate; }
  @keyframes pulse  { 0%,100% { opacity:.45 } 50% { opacity:1 } }
  @keyframes gem    { 0%,100% { opacity:.75 } 50% { opacity:1 } }
  @keyframes spin   { to { transform: rotate(360deg) } }
  @keyframes sway-l { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-3deg) } }
  @keyframes sway-r { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(3deg) } }
  @keyframes swirl  { to { stroke-dashoffset: -290 } }
  @keyframes drift  { from { transform: translate(-30px,10px) scale(1) } to { transform: translate(40px,-25px) scale(1.15) } }
  @keyframes rise {
    0%   { transform: translate(0,0); opacity:0 }
    10%  { opacity: var(--o) }
    50%  { transform: translate(var(--dx), calc(var(--dy) * .5)) }
    85%  { opacity: var(--o) }
    100% { transform: translate(calc(var(--dx) * -.4), var(--dy)); opacity:0 }
  }
  @keyframes fall {
    0%   { transform: translate(0,0) rotate(var(--r0)); opacity:0 }
    10%  { opacity:.95 }
    85%  { opacity:.9 }
    100% { transform: translate(var(--dx), 820px) rotate(var(--r1)); opacity:0 }
  }
  @keyframes flutter { from { transform: rotate(-22deg) } to { transform: rotate(22deg) } }
</style>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var stage = document.getElementById('stage');

  // Escala o layout 1080x1920 para caber em qualquer tamanho de fonte de navegador
  function fit() {
    var s = Math.min(innerWidth / 1080, innerHeight / 1920);
    var x = (innerWidth - 1080 * s) / 2, y = (innerHeight - 1920 * s) / 2;
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  if (q.get('fundo') === '0') document.getElementById('fundo').style.display = 'none';
  if (q.get('nome')) document.getElementById('nick').textContent = q.get('nome').toUpperCase();
  if (q.get('sub'))  document.getElementById('sub').textContent  = q.get('sub').toUpperCase();

  // Os círculos de runas giram em sentidos opostos
  var spins = document.querySelectorAll('#fundo .spin');
  if (spins[1]) spins[1].classList.add('spin-r');

  if (q.get('particulas') === '0') return;
  var box = document.getElementById('particulas');
  function rnd(a, b) { return a + Math.random() * (b - a); }

  // Brasas carmesim subindo
  for (var i = 0; i < 70; i++) {
    var e = document.createElement('div');
    var size = rnd(4, 11);
    e.className = 'ember';
    e.style.width = e.style.height = size + 'px';
    e.style.left = rnd(0, 1080) + 'px';
    e.style.top = rnd(300, 1960) + 'px';
    e.style.setProperty('--dx', rnd(-60, 60) + 'px');
    e.style.setProperty('--dy', -rnd(250, 700) + 'px');
    e.style.setProperty('--o', rnd(.45, 1).toFixed(2));
    e.style.animationDuration = rnd(6, 14) + 's';
    e.style.animationDelay = -rnd(0, 14) + 's';
    box.appendChild(e);
  }

  // Penas negras caindo de vez em quando
  var FEATHER = '<svg viewBox="-20 -110 40 115" class="w-full h-full overflow-visible"><path d="M0,0 C18,-25 16,-75 0,-100 C-9,-80 -15,-35 0,0 Z" fill="#1a1022" stroke="#9c92b0" stroke-opacity=".6" stroke-width="1.2"/><path d="M0,0 Q1.5,-50 0,-96" stroke="#cfc8dc" stroke-width="1.3" fill="none" opacity=".8"/></svg>';
  function feather() {
    var f = document.createElement('div');
    var sz = rnd(26, 46);
    f.className = 'fall';
    f.style.width = sz + 'px'; f.style.height = sz * 2.8 + 'px';
    f.style.left = rnd(20, 1040) + 'px';
    f.style.top = rnd(-140, 1000) + 'px';
    f.style.setProperty('--dx', rnd(-140, 140) + 'px');
    f.style.setProperty('--r0', rnd(-60, 60) + 'deg');
    f.style.setProperty('--r1', rnd(-200, 200) + 'deg');
    var d = rnd(9, 15);
    f.style.animationDuration = d + 's';
    f.innerHTML = '<div>' + FEATHER + '</div>';
    box.appendChild(f);
    setTimeout(function () { f.remove(); }, d * 1000 + 200);
  }
  for (var k = 0; k < 4; k++) setTimeout(feather, k * 900);
  setInterval(feather, 2600);
})();
</script>
